name = "portfolio-analytics"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[vars]
# Only beacons from these origins are recorded (comma-separated).
ALLOWED_ORIGINS = "https://bi1ku.github.io"

[[d1_databases]]
binding = "DB"
database_name = "portfolio-analytics"
database_id = "8c49330b-2899-42d0-ba9d-1e1834748539"
migrations_dir = "migrations"

# Secrets (set with `npx wrangler secret put <NAME>`, never commit them):
#   DASHBOARD_PASSWORD  required: password for /dashboard (any username)
#   IPAPI_KEY           optional: free ipapi.is key for real VPN/proxy/Tor flags
